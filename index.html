
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mia AI Mega</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d18;color:#fff;font-family:Arial}
.app{max-width:700px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#1a1422}
header{padding:16px;background:#25192f;display:flex;align-items:center;gap:12px}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(45deg,#ff65b5,#9b64ff);display:grid;place-items:center;font-size:23px}
header small{color:#c7a8d8}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:13px;border-radius:16px;max-width:85%;white-space:pre-wrap;line-height:1.5}
.ai{align-self:flex-start;background:#35253f}
.user{align-self:flex-end;background:#c04c98}
img.generated{width:100%;border-radius:14px;margin-top:10px}
.bottom{background:#25192f;padding:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:140px;background:#392943;color:white;border:0;border-radius:14px;padding:14px}
button{border:0;padding:12px;border-radius:12px;background:#c04c98;color:white;font-weight:bold}
button.secondary{background:#584269}
.status{font-size:12px;color:#c4a9d4;margin:10px 2px 0}
</style>
</head>
<body>
<div class="app">
<header>
<div class="avatar">💗</div>
<div>
<strong>Mia AI Mega</strong><br>
<small>AI Companion · Demo</small>
</div>
</header>

<div id="chat">
<div class="msg ai">Hii 💗 I'm Mia! Let's chat. You can ask me to imagine and illustrate a scene too.</div>
</div>

<div class="bottom">
<div class="controls">
<input id="msg" placeholder="Type a message..." autocomplete="off">
<button onclick="send()">Send</button>
<button class="secondary" onclick="makeScene()">🎨 Scene</button>
<button class="secondary" onclick="voice()">🔊 Voice</button>
</div>
<div class="status" id="status">AI backend not connected</div>
</div>
</div>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('msg');
const statusBox=document.getElementById('status');

let history=[];
let lastReply="";

function bubble(text,type){
 const d=document.createElement('div');
 d.className='msg '+type;
 d.textContent=text;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
 return d;
}

async function send(){
 const t=input.value.trim();
 if(!t)return;
 input.value='';
 bubble(t,'user');
 history.push({role:'user',content:t});
 statusBox.textContent='Thinking...';

 try{
  const r=await fetch('/api/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:history})
  });
  if(!r.ok)throw new Error('API error');
  const data=await r.json();
  lastReply=data.reply||'No response';
  bubble(lastReply,'ai');
  history.push({role:'assistant',content:lastReply});
  statusBox.textContent='Connected';
 }catch(e){
  bubble('Backend connect nahi hai. /api/chat ko apne AI server se connect karo.','ai');
  statusBox.textContent='Backend offline';
 }
}

async function makeScene(){
 statusBox.textContent='Scene imagine ho raha hai...';

 const context=history.slice(-12);
 if(context.length===0){
  bubble('Pehle conversation karo, phir scene create karenge 💗','ai');
  return;
 }

 try{
  const r=await fetch('/api/image',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    messages:context,
    instruction:
    'Create a context-aware, non-explicit illustration '+
    'of the scene described in the conversation. '+
    'Do not depict sexual content, nudity, or minors in romantic scenes.'
   })
  });

  if(!r.ok)throw new Error('Image API error');
  const data=await r.json();

  if(data.imageUrl){
   const b=bubble('🎨 Scene generated','ai');
   const im=document.createElement('img');
   im.src=data.imageUrl;
   im.className='generated';
   im.alt='Generated scene';
   b.appendChild(im);
  }else if(data.prompt){
   const b=bubble('Image prompt: '+data.prompt,'ai');
   const btn=document.createElement('button');
   btn.textContent='Copy prompt';
   btn.onclick=()=>navigator.clipboard.writeText(data.prompt);
   b.appendChild(btn);
  }
  statusBox.textContent='Done';
 }catch(e){
  bubble('Image backend connect nahi hai. /api/image endpoint connect karo.','ai');
  statusBox.textContent='Image backend offline';
 }
}

function voice(){
 if(!lastReply){
  alert('Pehle AI reply aane do.');
  return;
 }
 if(!speechSynthesis)return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(lastReply);
 u.lang='hi-IN';
 u.rate=1;
 const voices=speechSynthesis.getVoices();
 const v=voices.find(x=>/female|zira|samantha/i.test(x.name));
 if(v)u.voice=v;
 speechSynthesis.speak(u);
}

input.addEventListener('keydown',e=>{
 if(e.key==='Enter')send();
});
</script>
</body>
</html>
